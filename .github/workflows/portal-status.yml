name: Daily Portal Status Check
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-status-main
  cancel-in-progress: false
jobs:
  check:
    name: Observe and persist public status
    # Never run a secret-bearing scheduled/manual publish against a feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Only to persist the reviewed status/data JSON allowlist below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - name: Check portals with bounded request timeout
        run: >-
          python status/check.py --output-dir status/data --timeout 20 --workers 4
          --source-location "Unknown geographic location"
          --source-provider "GitHub" --source-type "GitHub hosted runner"
      - name: Stage static assets and validated public JSON only
        run: python scripts/check_repository.py --stage-static "$RUNNER_TEMP/site-stage"
      - name: Commit only monitoring JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import re
          import subprocess
          pattern = re.compile(r'status/data/(?:[0-9]{4}-[0-9]{2}-[0-9]{2}|latest|index|history)\.json')
          paths = subprocess.check_output(['git', 'ls-files', '--modified', '--others', '--exclude-standard', '-z', 'status/data']).decode().split('\0')
          paths = sorted(set(filter(None, paths)))
          if any(not pattern.fullmatch(path) for path in paths):
              raise SystemExit('Refusing unexpected monitoring output')
          if paths:
              subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "status: daily check $(date -u +%Y-%m-%d)"
            # Ephemeral authentication; no credentials persisted by checkout or git config.
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            printf '::add-mask::%s\n' "$AUTH"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          fi
      - name: Upload the static-only staging artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-status-static
          path: ${{ runner.temp }}/site-stage
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
  deploy:
    name: Deploy static status site
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portal-status-static
          path: ${{ runner.temp }}/site-stage
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require the existing deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            printf '%s\n' 'Required Cloudflare deployment token is unavailable.' >&2
            exit 1
          fi
      - name: Deploy static staging directory
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3; node24 runtime
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bb88d649c15e3a7bd66000a5467ca3ad
          wranglerVersion: '4.149.0'
          packageManager: npm
          command: pages deploy "${{ runner.temp }}/site-stage" --project-name gov-portal-status --branch main
